[mod-name]
planet-power-link=Planet Power Link

[mod-description]
planet-power-link=Send electricity between planets and space platforms through a shared power pool. Available from the start of the game.

[entity-name]
ppl-power-link=Planet power transmitter
ppl-power-receiver=Planet power receiver

[item-name]
ppl-power-link=Planet power transmitter
ppl-power-receiver=Planet power receiver

[entity-description]
ppl-power-link=Takes spare power from its planet and sends it into the shared pool. Click it to change its network. Drag a receiver over it to swap it in place.
ppl-power-receiver=Takes power out of the shared pool and feeds it into its planet when the planet runs short. Click it to change its network. Drag a transmitter over it to swap it in place.

[item-description]
ppl-power-link=Places a transmitter. Transmitters and receivers with the same network ID share one pool of power, on any planet or platform.
ppl-power-receiver=Places a receiver. Transmitters and receivers with the same network ID share one pool of power, on any planet or platform.

[mod-setting-name]
ppl-buffer-gj=Pool size per node (GJ)
ppl-flow-mw=Max transfer per node (MW)
ppl-scale-recipe=Scale recipe cost with max transfer
ppl-allow-cerys=Allow on any planet
ppl-upkeep-mw=Upkeep per node (MW)
ppl-update-interval=Update interval (ticks)
ppl-refill-minutes=Pool refill time (minutes)

[mod-setting-description]
ppl-buffer-gj=How much energy each node adds to its network's pool. A bigger pool rides out longer shortages. Needs a game restart.
ppl-flow-mw=The most power one node can take in or give out (up to 10000). Needs a game restart. With "Scale recipe cost" on, a node costs max transfer / 1000 times the base recipe.
ppl-scale-recipe=When on, a node's ingredients are multiplied by max transfer / 1000 (x10 at 10000 MW), so a big node never costs less than the same capacity in small ones. Needs a game restart.
ppl-allow-cerys=Planet mods such as Cerys (radiation) and Moshine (heat) ban accumulators on their planets, and our buildings are accumulators. When on, transmitters and receivers can be placed on any planet. Turn it off to keep those mods' original rules. Needs a game restart.
ppl-upkeep-mw=Energy each node continuously uses from the shared pool. Set to 0 for free nodes.
ppl-update-interval=How often each node is updated, in ticks (60 ticks = 1 second). The work is spread over the ticks, so higher values use less UPS. 10 is a good balance.
ppl-refill-minutes=Without a manual send limit, transmitters take what the other planets are drawing plus enough to refill the pool in this many minutes, instead of draining your power plant as hard as they can. 0 turns this off (no limit).
